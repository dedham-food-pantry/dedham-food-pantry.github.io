baseURL = '/'
languageCode = 'en-us'
title = 'Dedham Food Pantry'

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.renderHooks]
[markup.goldmark.renderHooks.link]
# This tells Hugo to "capture" resources using ".Get".  If I don't use
# this, then page resources don't get processed by the pipeline so
# they don't get copied from the page bundle to the public directory.
# I'm not sure why this "default" isn't enabled by default.
# https://gohugo.io/render-hooks/links/#default
enableDefault = true

[Params]
description = "The Dedham Food Pantry provides food at no cost to qualifying Dedham residents."
googleFontsLink = false

[Params.contact]
addressLine1 = "600 Washington Street"
addressLine2 = "Dedham, MA 02026"
addressNote = "North end of the Dedham Plaza"
mapLink = "https://maps.app.goo.gl/TsfNto11XW5p3oYS6"
donationHours = ["Tuesday–Friday: 10am–12pm", "Saturday: 12pm–2pm"]
shoppingHoursLink = "/help/signup/"
phone = "(781) 269-1541"
phoneLink = "tel:+17812691541"
email = "manager@dedhamfoodpantry.org"

[[Params.social]]
name = "Facebook"
url = "https://www.facebook.com/DedhamFoodPantry"
[[Params.social]]
name = "Instagram"
url = "https://www.instagram.com/dedhamfoodpantry/"
[[Params.social]]
name = "LinkedIn"
url = "https://www.linkedin.com/company/dedhamfoodpantry"

[Params.logo]
# Full logo with the name and tagline built in. It's the only content of
# the home link, so altText is what screen readers announce for that link.
image = "DFP_Logo_Full.png"
width = 1000
height = 296
altText = "Dedham Food Pantry: Neighbors Helping Neighbors. Home page"

[Params.style.vars]
  highlightColor = "#477000"

[menus]
  [[menus.main]]
    name = 'Need Help?'
    pageRef = '/help/'
    weight = 1
  [[menus.main]]
    name = 'Please Volunteer'
    url = 'https://dedhamfoodpantry.galaxydigital.com/need/'
    weight = 2
  [[menus.main]]
    name = 'Please Donate'
    pageRef = '/donate/'
    weight = 3
  [[menus.main]]
    name = 'About Us'
    pageRef = '/about/'
    weight = 4
