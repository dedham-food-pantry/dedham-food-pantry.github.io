{{ define "main" }}
<main id="main-content" tabindex="-1">
	{{- with .Title }}
	<header class="main__header">
		<h1 class="main__title">{{ . }}</h1>
	</header>
	{{- end }}

  {{- $kids := .Pages }}
  {{- if gt (len $kids) 0 }}
	<div class="content">
  <h2>Contents</h2>
  <ul>
  {{- range $name := $kids }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
  {{- end }}
  </ul>
  {{- end }}
	</div>

{{ partial "pagination.html" . }}
</main>
{{ end }}
