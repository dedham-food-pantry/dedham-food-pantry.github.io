{{ define "main" }}
<main id="main-content" tabindex="-1">
	<article class="post">
		{{- if .Title }}
		<header class="post__header">
			<h1 class="post__title">{{ .Title }}</h1>
			{{- with .Params.lead }}
			<p class="post__lead">{{ . }}</p>
			{{- end }}
		</header>
		{{- end }}
		<div class="content post__content">
			{{ .Content }}
		</div>
	</article>
</main>
{{ end }}
